<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Desactiva la Bomba</title>

<!-- FIX para móviles / notch / status bar -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
  <div class="title">💣 Desactiva la Bomba</div>
  <p id="instruction">Resuelve el mini-acertijo y decide: piensa, no adivines.</p>
  <div id="rule" class="rule">Regla: el cable correcto no se repite</div>

  <div class="controls">
    <div class="status">
      <span id="score">Puntos: 0</span>
      <span id="round">Ronda: 1/5</span>
      <span id="mult">Multiplicador: x1</span>
    </div>
    <div class="resources">
      <button id="addTime" class="hint" onclick="buyTime()">+3s (-3)</button>
    </div>
  </div>

  <div class="timer" id="timer">10</div>

  <div id="puzzle" class="puzzle"></div>

  <div class="cables" id="cables">
    <div class="cable-wrap">
      <button class="cable red" onclick="cutCable(0)">Cable Rojo</button>
      <div class="choice" id="choice-0"></div>
    </div>
    <div class="cable-wrap">
      <button class="cable blue" onclick="cutCable(1)">Cable Azul</button>
      <div class="choice" id="choice-1"></div>
    </div>
    <div class="cable-wrap">
      <button class="cable green" onclick="cutCable(2)">Cable Verde</button>
      <div class="choice" id="choice-2"></div>
    </div>
  </div>

  <div class="hint-row">
    <button id="hint" class="hint" onclick="useHint()">Pedir pista</button>
  </div>

  <div id="message" class="message hidden"></div>

  <div class="result hidden" id="result"></div>
  <button class="reset hidden" id="reset" onclick="startGame()">Reiniciar</button>
</div>

<script src="script.js"></script>
</body>
</html>
